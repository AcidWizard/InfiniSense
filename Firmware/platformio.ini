[platformio]
default_envs = sensor_release, router_release, sensor_debug, router_debug

[base_env]
platform = nordicnrf52@^11.0.0
board = nrf52840_dk
framework = arduino
lib_deps =
    jgromes/RadioLib@~6.6.0
build_flags =
    -DRADIOLIB_TONE_UNSUPPORTED
    -Wextra
# -Werror is scoped to our own code: src/ here, and each lib via its
# library.json. Third-party framework/RadioLib warnings stay warnings.
build_src_flags = -Werror
monitor_speed = 115200

#environment bases

[debug_env]
extends = base_env
build_type = debug

[release_env]
extends = base_env
build_type = release

[sensor_env]
build_flags = ${base_env.build_flags} -DNODE_ROLE=0
# Telemetry is router-only (and pulls in the serial port), so keep it out of the
# energy-constrained sensor image entirely. main.cpp guards its references with
# the matching NODE_ROLE check.
lib_ignore = Telemetry

[router_env]
build_flags = ${base_env.build_flags} -DNODE_ROLE=1

#actual environments

[env:sensor_debug]
extends = debug_env, sensor_env

[env:sensor_release]
extends = release_env, sensor_env

[env:router_debug]
extends = debug_env, router_env

[env:router_release]
extends = release_env, router_env

# Seeed Studio XIAO nRF52840 (+ Wio-SX1262). Unlike the nrf52840_dk target this
# uses the Seeed/Adafruit core, so `Serial` is the USB-CDC port and uploads go
# through the XIAO bootloader (nrfutil) on the auto-detected serial port
# instead of J-Link. Put the board in bootloader mode (double-tap reset) if the
# port does not switch on its own.
[env:router_xiao]
extends = base_env
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840
# -Wextra trips the unused-parameter warnings the Adafruit core's own
# softdevice headers emit through <Arduino.h>; disable just that one.
build_flags =
    ${base_env.build_flags}
    -DNODE_ROLE=1
    -DSLEEP_TICKLESS=1
    -Wno-unused-parameter
# Wait for the application USB CDC to re-enumerate after the DFU reset so
# `-t upload -t monitor` reconnects without unplugging the board.
extra_scripts = scripts/wait_for_app_port.py

# Seeed Studio XIAO nRF52840 (+ Wio-SX1262) sensor. Same Seeed/Adafruit core
# and bootloader upload as router_xiao.
[env:sensor_xiao]
extends = base_env
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840
build_flags =
    ${base_env.build_flags}
    -DNODE_ROLE=0
    -DSLEEP_TICKLESS=1
    -Wno-unused-parameter
lib_ignore = Telemetry
extra_scripts = scripts/wait_for_app_port.py

# Debug variants of the XIAO environments: buildtype=debug defines
# __PLATFORMIO_BUILD_DEBUG__ so logging is compiled in and the radio prints its
# init/TX/RX status on the USB CDC serial port. Still uploads over the XIAO
# bootloader.
[env:router_xiao_debug]
extends = env:router_xiao
build_type = debug

[env:sensor_xiao_debug]
extends = env:sensor_xiao
build_type = debug

# Temporary bench env: sensor_xiao without radio init, to measure the radio
# bring-up's contribution to sleep current. Remove once diagnosed.
[env:sensor_xiao_noradio]
extends = env:sensor_xiao
build_flags =
    ${env:sensor_xiao.build_flags}
    -DSENSOR_SKIP_RADIO=1

# Host test environment. Compiles the module logic against the stubs in
# test/stubs so Mesh/Sensor can run on a PC. Radio is ignored: mesh.cpp links
# against the stub radio.h instead of the real SX1262 wrapper.
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++11
    -DUNIT_TEST
    -Itest/stubs
    -Wextra
    -Werror
lib_ignore =
    Radio
    Telemetry

# Same host tests as `native`, instrumented with GCC's --coverage so gcovr can
# report line/branch coverage. The link flags cannot come from build_flags: the
# native builder does not pass them to the linker, hence the extra script.
[env:native_coverage]
extends = env:native
build_flags =
    ${env:native.build_flags}
    --coverage
    -O0
extra_scripts = post:scripts/coverage_link.py
