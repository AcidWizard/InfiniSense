; Minimal heartbeat-sleep bench for measuring the nRF52840 System ON current
; with nothing else connected: no radio, no mesh, no serial.
;
; This is a standalone project (not part of the main Firmware build). Run it
; from this directory:
;
;   pio run -e xiao     -t upload   # System ON heartbeat sleep (tickless)
;   pio run -e xiao_off -t upload   # pure System OFF, D6 edge wake only
;
; The XIAO runs the Adafruit/Seeed core (FreeRTOS + TinyUSB), which is where
; the 1 kHz RTOS tick keeps the CPU waking. The nrf52840_dk target uses the
; other (non-FreeRTOS) core, so this test is XIAO-only.
;
; Then measure on the 3V3 rail (or BAT pads) with USB unplugged.

[platformio]
default_envs = xiao

[env:xiao]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
build_flags = -Wno-unused-parameter
monitor_speed = 115200

; Heartbeat only, no GPIO interrupt: isolates the core's System ON floor from
; any D6 noise/wake source.
[env:xiao_hb]
extends = env:xiao
build_flags =
    ${env:xiao.build_flags}
    -DSLEEP_TEST_NO_PIN

; Heartbeat only but with the SPI bus initialised (as a failed radio::Begin()
; leaves it): tests whether SPI.begin() alone leaks current.
[env:xiao_hb_spi]
extends = env:xiao
build_flags =
    ${env:xiao.build_flags}
    -DSLEEP_TEST_NO_PIN
    -DSLEEP_TEST_SPI

; Same, then SPI.end() again: tests whether ending the bus releases the leak.
[env:xiao_hb_spi_end]
extends = env:xiao
build_flags =
    ${env:xiao.build_flags}
    -DSLEEP_TEST_NO_PIN
    -DSLEEP_TEST_SPI
    -DSLEEP_TEST_SPI_END

; Same as xiao_hb but with the sensor's 2 s watchdog running: tests whether the
; WDT pauses during the tickless sleep (a running WDT would reset the board
; every 2 s and pin the average near the boot current).
[env:xiao_hb_wdt]
extends = env:xiao
build_flags =
    ${env:xiao.build_flags}
    -DSLEEP_TEST_NO_PIN
    -DSLEEP_TEST_WDT

; System OFF with a D6 edge wake: the shipped sleep's lowest-power mode.
[env:xiao_off]
extends = env:xiao
build_flags =
    ${env:xiao.build_flags}
    -DSLEEP_TEST_SYSTEM_OFF

; System OFF with no wake source at all: the true board floor. Recover with the
; reset button (double-tap reset to re-enter the bootloader for reflashing).
[env:xiao_off_bare]
extends = env:xiao
build_flags =
    ${env:xiao.build_flags}
    -DSLEEP_TEST_SYSTEM_OFF
    -DSLEEP_TEST_NO_WAKE

; Same no-wake System OFF on the nRF52840-DK, as a known-good reference board
; to tell a XIAO/board-power issue from a firmware one.
[env:dk_off_bare]
platform = nordicnrf52@^11.0.0
board = nrf52840_dk
framework = arduino
build_flags =
    -DSLEEP_TEST_SYSTEM_OFF
    -DSLEEP_TEST_NO_WAKE
monitor_speed = 115200
